<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UGTE - Staff Login | تسجيل الدخول</title>

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Cairo Font (same as Ramadan campaign) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap"
      rel="stylesheet"
    />

    <!-- <link href="tailwind.css" rel="stylesheet" /> -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="min-h-screen bg-green-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
        <div class="text-center mb-6">
          <div class="text-4xl mb-2 rounded-2xl">🤲</div>
          <h1 class="text-2xl font-bold">نظام إدارة التبرعات</h1>
          <p class="text-gray-600">UGTE Donations Management System</p>
        </div>

        <!-- Message Area -->
        <div
          id="message"
          class="hidden mb-4 p-3 rounded-lg text-sm text-center"
        ></div>

        <form class="space-y-4" id="loginForm">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              البريد الإلكتروني / Email
            </label>
            <input
              type="email"
              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
              id="email"
              required
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
              كلمة المرور / Password
            </label>
            <input
              type="password"
              class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent"
              id="password"
              required
            />
          </div>

          <button
            type="submit"
            class="w-full bg-green-700 text-white py-2 rounded-lg font-bold hover:bg-green-800 transition"
            id="submitBtn"
          >
            تسجيل الدخول / Login
          </button>

          <p class="text-center text-sm text-gray-500 mt-4">
            للموظفين المصرح لهم فقط / Authorized Staff Only
          </p>
        </form>
      </div>
    </div>
  </body>
  <script type="module" src="login.js"></script>
</html>
